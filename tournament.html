<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Texas Scramble Pro</title>
    <style>
        /* Apple iOS Style CSS */
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f7;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 100px 16px; /* Extra padding onder voor de tab bar */
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 650px;
            width: 100%;
        }
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
        }
        h2, h3 {
            color: #000000;
            text-align: center;
            margin-top: 0;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 13px;
            text-align: center;
            color: #8e8e93;
            margin-bottom: 24px;
        }
        
        /* Segmented Control (Toggle) */
        .toggle-container {
            display: flex;
            background-color: #e3e3e8;
            border-radius: 8px;
            padding: 2px;
            margin-bottom: 24px;
        }
        .toggle-btn {
            flex: 1;
            padding: 8px 12px;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            color: #000000;
            border-radius: 6px;
            transition: all 0.2s ease-in-out;
            touch-action: manipulation;
            user-select: none;
        }
        .toggle-btn.active {
            background-color: #ffffff;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 3px 1px rgba(0,0,0,0.04);
        }

        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #1c1c1e;
        }
        input[type="number"], input[type="text"], select {
            width: 100%;
            padding: 12px 14px;
            background-color: #f2f2f7;
            border: none;
            border-radius: 10px;
            font-size: 16px; /* Voorkomt zoom op iOS */
            color: #000000;
            -webkit-appearance: none;
        }
        input[readonly] {
            background-color: #e3e3e8;
            color: #8e8e93;
        }
        select {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238e8e93%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px top 50%;
            background-size: 12px auto;
            padding-right: 30px;
        }
        input:focus:not([readonly]), select:focus {
            outline: 2px solid #007aff;
            background-color: #ffffff;
        }
        
        .player-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .player-row select { flex: 2; }
        .player-row input[type="number"] { flex: 1; text-align: center; }
        
        .divider {
            border-bottom: 1px solid #e5e5ea;
            margin: 24px 0;
        }
        
        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        button.action-btn {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
            touch-action: manipulation;
            user-select: none;
        }
        button.action-btn:active { opacity: 0.7; }
        
        .btn-primary { background-color: #007aff; color: white; }
        .btn-success { background-color: #34c759; color: white; }
        .btn-secondary { background-color: #e5e5ea; color: #007aff; }
        
        .btn-delete {
            background-color: transparent;
            color: #ff3b30;
            border: none;
            font-size: 18px;
            padding: 5px;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
        }

        #result-box {
            margin-top: 24px;
            padding: 20px;
            background-color: #f2f2f7;
            border-radius: 14px;
            display: none;
        }
        .result-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: #3a3a3c;
        }
        .total-line {
            font-size: 17px;
            font-weight: 600;
            color: #000000;
            border-top: 1px solid #c6c6c8;
            padding-top: 12px;
            margin-top: 12px;
        }
        .net-score-text {
            font-size: 22px;
            font-weight: 700;
            color: #007aff;
        }

        .table-container { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
            text-align: left;
        }
        th, td {
            padding: 12px 8px;
            border-bottom: 1px solid #e5e5ea;
        }
        th { color: #8e8e93; font-weight: 600; font-size: 12px; text-transform: uppercase; }
        .rank-1 { background-color: rgba(255, 215, 0, 0.15); }
        .rank-2 { background-color: rgba(192, 192, 192, 0.15); }
        .rank-3 { background-color: rgba(205, 127, 50, 0.15); }

        /* iOS Tab Bar Bottom */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(249, 249, 249, 0.94);
            backdrop-filter: blur(10px);
            border-top: 1px solid #e5e5ea;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 25px 0; /* Padding voor iOS swipe bar */
            z-index: 1000;
        }
        .tab-item {
            text-align: center;
            color: #8e8e93;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
        }
        .tab-item.active { color: #007aff; }
        .tab-icon { font-size: 24px; margin-bottom: 3px; display: block; }

        /* Tab Content Weergave */
        .tab-content { display: none; width: 100%; }
        .tab-content.active { display: block; }
        
        /* Flexbox voor Speler Toevoegen form */
        .add-player-form { display: flex; gap: 10px; align-items: flex-end; }
        .add-player-form .field { flex: 1; }
        .add-player-form button { flex: 0.5; padding: 12px; }
    </style>
</head>
<body>

<!-- TAB 1: CALCULATOR -->
<div id="tab-calculator" class="container tab-content active">
    <div class="card">
        <h2>Scramble Calculator</h2>
        <p class="subtitle" id="mode-subtitle">WHS Methode 2 personen: 35% / 15%</p>
        
        <div class="toggle-container">
            <div class="toggle-btn active" id="btn-2p" onclick="setMode(2)">2 Spelers</div>
            <div class="toggle-btn" id="btn-3p" onclick="setMode(3)">3 Spelers</div>
            <div class="toggle-btn" id="btn-4p" onclick="setMode(4)">4 Spelers</div>
        </div>
        
        <div class="form-group">
            <label>Teamnaam / Flight</label>
            <input type="text" id="teamName" placeholder="Bijv. Flight 1">
        </div>

        <div class="divider"></div>

        <div class="form-group">
            <label>Spelers (Selecteer uit lijst)</label>
            <div class="player-row">
                <select id="p1-select" onchange="autoFillHcp(1)"><option value="">Kies Speler A...</option></select>
                <input type="number" id="hcp1" step="0.1" placeholder="Hcp" readonly>
            </div>
            <div class="player-row">
                <select id="p2-select" onchange="autoFillHcp(2)"><option value="">Kies Speler B...</option></select>
                <input type="number" id="hcp2" step="0.1" placeholder="Hcp" readonly>
            </div>
            <div class="player-row" id="row-p3" style="display: none;">
                <select id="p3-select" onchange="autoFillHcp(3)"><option value="">Kies Speler C...</option></select>
                <input type="number" id="hcp3" step="0.1" placeholder="Hcp" readonly>
            </div>
            <div class="player-row" id="row-p4" style="display: none;">
                <select id="p4-select" onchange="autoFillHcp(4)"><option value="">Kies Speler D...</option></select>
                <input type="number" id="hcp4" step="0.1" placeholder="Hcp" readonly>
            </div>
        </div>

        <div class="divider"></div>

        <div class="form-group">
            <label>Bruto Score (slagen)</label>
            <input type="number" id="gross" placeholder="Totaal aantal slagen">
        </div>

        <div class="button-row">
            <button class="action-btn btn-primary" onclick="calculateScramble()">Bereken</button>
            <button class="action-btn btn-success" onclick="saveTeamResult()">Sla op</button>
        </div>
        <div class="button-row">
            <button class="action-btn btn-secondary" onclick="resetForm()">Reset formulier</button>
        </div>

        <div id="result-box">
            <strong style="display:block; margin-bottom: 12px; font-size: 15px;">Berekening Teamhandicap:</strong>
            <div id="breakdown-content"></div>
            
            <div class="result-line total-line">
                <span>Teamhandicap:</span>
                <span id="out-teamhcp">0.00</span>
            </div>
            <div class="result-line total-line">
                <span>NETTO SCORE:</span>
                <span class="net-score-text" id="out-net">0.00</span>
            </div>
        </div>
    </div>

    <!-- Leaderboard -->
    <div class="card" id="leaderboard-card" style="display: none;">
        <h3>Klassement</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Team</th>
                        <th>Type</th>
                        <th>Bruto</th>
                        <th>Hcp</th>
                        <th>Netto</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
        <br>
        <button class="action-btn btn-secondary" style="width: 100%;" onclick="exportToCSV()">Exporteer naar CSV</button>
    </div>
</div>

<!-- TAB 2: SPELERS BEHEREN -->
<div id="tab-players" class="container tab-content">
    <div class="card">
        <h2>Spelers Database</h2>
        <p class="subtitle"><span id="player-count">0</span> / 30 geregistreerd</p>
        
        <div class="add-player-form">
            <div class="field">
                <label>Naam</label>
                <input type="text" id="newPlayerName" placeholder="Naam speler">
            </div>
            <div class="field">
                <label>Handicap</label>
                <input type="number" id="newPlayerHcp" step="0.1" placeholder="Hcp">
            </div>
            <button class="action-btn btn-primary" onclick="addPlayer()">Voeg toe</button>
        </div>
    </div>

    <div class="card" id="players-list-card" style="display: none;">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Naam</th>
                        <th>Handicap</th>
                        <th style="text-align: center;">Wissen</th>
                    </tr>
                </thead>
                <tbody id="players-body"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- BOTTOM TAB BAR -->
<div class="tab-bar">
    <div class="tab-item active" id="nav-calculator" onclick="switchTab('calculator')">
        <span class="tab-icon">⛳️</span>
        Calculator
    </div>
    <div class="tab-item" id="nav-players" onclick="switchTab('players')">
        <span class="tab-icon">👥</span>
        Spelers
    </div>
</div>

<script>
    // Data opslag arrays
    let playersList = JSON.parse(localStorage.getItem('scramble_players')) || [];
    let savedResults = JSON.parse(localStorage.getItem('scramble_results')) || [];
    let currentMode = 2; // Standaard aantal spelers

    // Initialisatie bij laden pagina
    window.onload = function() {
        renderPlayersList();
        updatePlayerDropdowns();
        renderLeaderboard();
        setMode(currentMode);
    }

    // --- TAB NAVIGATIE ---
    function switchTab(tabId) {
        document.getElementById('tab-calculator').classList.remove('active');
        document.getElementById('tab-players').classList.remove('active');
        document.getElementById('nav-calculator').classList.remove('active');
        document.getElementById('nav-players').classList.remove('active');

        document.getElementById('tab-' + tabId).classList.add('active');
        document.getElementById('nav-' + tabId).classList.add('active');
    }

    // --- SPELERS DATABASE LOGICA ---
    function addPlayer() {
        let name = document.getElementById('newPlayerName').value.trim();
        let hcpText = document.getElementById('newPlayerHcp').value.replace(',', '.');
        let hcp = parseFloat(hcpText) || 0;

        if (!name) {
            alert("Vul een naam in.");
            return;
        }

        // Limiet van 30 personen
        if (playersList.length >= 30) {
            alert("De limiet is bereikt. Je kunt maximaal 30 deelnemers toevoegen.");
            return;
        }

        playersList.push({ name: name, hcp: hcp });
        // Sorteer alfabetisch
        playersList.sort((a, b) => a.name.localeCompare(b.name));
        
        savePlayersData();
        
        document.getElementById('newPlayerName').value = '';
        document.getElementById('newPlayerHcp').value = '';
        document.getElementById('newPlayerName').focus();
    }

    function deletePlayer(index) {
        if(confirm("Speler verwijderen? Dit beïnvloedt niet de opgeslagen resultaten in het klassement.")) {
            playersList.splice(index, 1);
            savePlayersData();
        }
    }

    function savePlayersData() {
        localStorage.setItem('scramble_players', JSON.stringify(playersList));
        renderPlayersList();
        updatePlayerDropdowns();
    }

    function renderPlayersList() {
        document.getElementById('player-count').innerText = playersList.length;
        let tbody = document.getElementById('players-body');
        tbody.innerHTML = "";
        
        playersList.forEach((p, index) => {
            let row = `<tr>
                <td><strong>${p.name}</strong></td>
                <td>${p.hcp.toFixed(1)}</td>
                <td style="text-align: center;"><button class="btn-delete" onclick="deletePlayer(${index})">✕</button></td>
            </tr>`;
            tbody.innerHTML += row;
        });

        document.getElementById('players-list-card').style.display = playersList.length > 0 ? 'block' : 'none';
    }

    function updatePlayerDropdowns() {
        let optionsHTML = '<option value="">Kies uit lijst...</option>';
        playersList.forEach(p => {
            optionsHTML += `<option value="${p.hcp}">${p.name} (Hcp: ${p.hcp.toFixed(1)})</option>`;
        });

        for(let i=1; i<=4; i++) {
            let selectElement = document.getElementById('p' + i + '-select');
            // Bewaar huidige selectie indien mogelijk
            let currentVal = selectElement.value; 
            selectElement.innerHTML = optionsHTML;
            // Als de speler was geselecteerd, en na het updaten is deze niet meer geldig, pas veld aan.
            autoFillHcp(i);
        }
    }

    // Automatisch handicap invullen bij keuze uit dropdown (Read-Only)
    function autoFillHcp(playerNum) {
        let select = document.getElementById('p' + playerNum + '-select');
        let hcpInput = document.getElementById('hcp' + playerNum);
        if(select.selectedIndex > 0) {
            hcpInput.value = select.value;
        } else {
            hcpInput.value = "";
        }
    }


    // --- CALCULATOR LOGICA ---
    function setMode(mode) {
        currentMode = mode;
        
        document.getElementById('btn-2p').classList.toggle('active', mode === 2);
        document.getElementById('btn-3p').classList.toggle('active', mode === 3);
        document.getElementById('btn-4p').classList.toggle('active', mode === 4);
        
        document.getElementById('row-p3').style.display = (mode >= 3) ? 'flex' : 'none';
        document.getElementById('row-p4').style.display = (mode === 4) ? 'flex' : 'none';
        
        let subtitle = "";
        if(mode === 2) subtitle = "WHS Methode 2 personen: 35% / 15%";
        else if(mode === 3) subtitle = "WHS Methode 3 personen: 30% / 20% / 10%";
        else subtitle = "WHS Methode 4 personen: 25% / 20% / 15% / 10%";
        
        document.getElementById('mode-subtitle').innerText = subtitle;
        document.getElementById('result-box').style.display = 'none';
    }

    function getPlayerNameFromSelect(playerNum) {
        let select = document.getElementById('p' + playerNum + '-select');
        if (select.selectedIndex > 0) {
            // Haal naam uit de tekst (verwijder de " (Hcp: X)" toevoeging)
            let rawText = select.options[select.selectedIndex].text;
            return rawText.split(" (Hcp:")[0];
        }
        return "Speler " + playerNum;
    }

    function getCalculatedData() {
        let teamName = document.getElementById('teamName').value.trim() || "Onbekend Team";
        let gross = parseFloat(document.getElementById('gross').value.replace(',','.')) || 0;
        
        let players = [];
        let rawHcps = [];

        // Check selected players
        for(let i=1; i<=currentMode; i++) {
            players.push(getPlayerNameFromSelect(i));
            rawHcps.push(parseFloat(document.getElementById('hcp' + i).value.replace(',','.')) || 0);
        }

        let hcps = [...rawHcps].sort((a, b) => a - b);
        let breakdown = [];
        
        if (currentMode === 4) {
            breakdown.push(hcps[0] * 0.25);
            breakdown.push(hcps[1] * 0.20);
            breakdown.push(hcps[2] * 0.15);
            breakdown.push(hcps[3] * 0.10);
        } else if (currentMode === 3) {
            breakdown.push(hcps[0] * 0.30);
            breakdown.push(hcps[1] * 0.20);
            breakdown.push(hcps[2] * 0.10);
        } else {
            breakdown.push(hcps[0] * 0.35);
            breakdown.push(hcps[1] * 0.15);
        }

        let teamHcp = breakdown.reduce((a, b) => a + b, 0);
        let netScore = gross > 0 ? (gross - teamHcp) : 0;

        return {
            mode: currentMode,
            teamName: teamName,
            playerNames: players,
            hcps: hcps,
            breakdown: breakdown,
            teamHcp: teamHcp,
            gross: gross,
            netScore: netScore
        };
    }

    function calculateScramble() {
        let data = getCalculatedData();
        let breakdownHTML = "";

        if (data.mode === 4) {
            breakdownHTML = `
                <div class="result-line"><span>Laagste hcp (${data.hcps[0]}) x 25%:</span> <span>${data.breakdown[0].toFixed(2)}</span></div>
                <div class="result-line"><span>2e hcp (${data.hcps[1]}) x 20%:</span> <span>${data.breakdown[1].toFixed(2)}</span></div>
                <div class="result-line"><span>3e hcp (${data.hcps[2]}) x 15%:</span> <span>${data.breakdown[2].toFixed(2)}</span></div>
                <div class="result-line"><span>Hoogste hcp (${data.hcps[3]}) x 10%:</span> <span>${data.breakdown[3].toFixed(2)}</span></div>
            `;
        } else if (data.mode === 3) {
            breakdownHTML = `
                <div class="result-line"><span>Laagste hcp (${data.hcps[0]}) x 30%:</span> <span>${data.breakdown[0].toFixed(2)}</span></div>
                <div class="result-line"><span>Middelste hcp (${data.hcps[1]}) x 20%:</span> <span>${data.breakdown[1].toFixed(2)}</span></div>
                <div class="result-line"><span>Hoogste hcp (${data.hcps[2]}) x 10%:</span> <span>${data.breakdown[2].toFixed(2)}</span></div>
            `;
        } else {
            breakdownHTML = `
                <div class="result-line"><span>Laagste hcp (${data.hcps[0]}) x 35%:</span> <span>${data.breakdown[0].toFixed(2)}</span></div>
                <div class="result-line"><span>Hoogste hcp (${data.hcps[1]}) x 15%:</span> <span>${data.breakdown[1].toFixed(2)}</span></div>
            `;
        }

        document.getElementById('breakdown-content').innerHTML = breakdownHTML;
        document.getElementById('out-teamhcp').innerText = data.teamHcp.toFixed(2);
        document.getElementById('out-net').innerText = data.gross > 0 ? data.netScore.toFixed(2) : "-";
        document.getElementById('result-box').style.display = 'block';
    }

    function saveTeamResult() {
        let data = getCalculatedData();
        if (data.gross === 0) {
            alert("Vul eerst een bruto score in voordat je opslaat.");
            return;
        }
        savedResults.push(data);
        localStorage.setItem('scramble_results', JSON.stringify(savedResults));
        
        renderLeaderboard();
        resetForm();
    }

    function deleteTeam(index) {
        if(confirm("Team verwijderen?")) {
            savedResults.splice(index, 1);
            localStorage.setItem('scramble_results', JSON.stringify(savedResults));
            renderLeaderboard();
        }
    }

    function renderLeaderboard() {
        let tbody = document.getElementById('leaderboard-body');
        tbody.innerHTML = ""; 
        
        savedResults.sort((a, b) => a.netScore - b.netScore);

        savedResults.forEach((team, index) => {
            let rankClass = "";
            if (index === 0) rankClass = "rank-1";
            else if (index === 1) rankClass = "rank-2";
            else if (index === 2) rankClass = "rank-3";

            let modeText = team.mode + "P";

            let row = `<tr class="${rankClass}">
                <td>${index + 1}</td>
                <td><strong>${team.teamName}</strong><br><span style="font-size: 11px; color: #8e8e93;">${team.playerNames.join(', ')}</span></td>
                <td>${modeText}</td>
                <td>${team.gross}</td>
                <td>${team.teamHcp.toFixed(2)}</td>
                <td><strong style="color:#007aff;">${team.netScore.toFixed(2)}</strong></td>
                <td style="text-align: center;"><button class="btn-delete" onclick="deleteTeam(${index})">✕</button></td>
            </tr>`;
            tbody.innerHTML += row;
        });

        document.getElementById('leaderboard-card').style.display = savedResults.length > 0 ? 'block' : 'none';
    }

    function resetForm() {
        document.getElementById('teamName').value = '';
        for(let i=1; i<=4; i++) {
            document.getElementById('p' + i + '-select').selectedIndex = 0;
            document.getElementById('hcp' + i).value = '';
        }
        document.getElementById('gross').value = '';
        document.getElementById('result-box').style.display = 'none';
    }

    function exportToCSV() {
        if (savedResults.length === 0) return alert("Geen resultaten om te exporteren.");

        let csvContent = "Positie,Teamnaam,Type,Speler 1,Speler 2,Speler 3,Speler 4,Bruto Score,Teamhandicap,Netto Score\n";
        
        savedResults.forEach((team, index) => {
            let safeName = team.teamName.replace(/,/g, " ");
            let s1 = (team.playerNames[0] || "").replace(/,/g, " ");
            let s2 = (team.playerNames[1] || "").replace(/,/g, " ");
            let s3 = team.mode >= 3 ? (team.playerNames[2] || "").replace(/,/g, " ") : "";
            let s4 = team.mode === 4 ? (team.playerNames[3] || "").replace(/,/g, " ") : "";
            let type = team.mode + "-Persoons";
            
            let row = `${index + 1},${safeName},${type},${s1},${s2},${s3},${s4},${team.gross},${team.teamHcp.toFixed(2)},${team.netScore.toFixed(2)}`;
            csvContent += row + "\n";
        });

        let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        let link = document.createElement("a");
        let url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", "scramble_uitslag.csv");
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
